# ==============================================================================
# Judge0 CE Configuration
# Reference: https://github.com/judge0/judge0
# ==============================================================================

# Server
PORT=2358
RAILS_ENV=production
BIND_ADDRESS=0.0.0.0

# Database Connection (Dedicated Judge0 Database)
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_db_password
POSTGRES_DB=judge0

# Redis Connection (Dedicated or Shared Queue)
REDIS_HOST=redis
REDIS_PORT=6379

# Execution Limits
MAX_QUEUE_SIZE=100
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=1.0
MAX_CPU_EXTRA_TIME=5.0
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=20.0
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=2048
MAX_MAX_FILE_SIZE=4096

# Features
ENABLE_SUBMISSION_DELETE=false
ENABLE_WAIT_RESULT=true
ENABLE_CALLBACKS=false
MAINTENANCE_MODE=false
